[project]
name = "captcha-worker-http"
version = "0.1.0"
description = "Main HTTP worker — pulls from the 'http' lane and dispatches to solvers at 1000+ concurrency, no browser."
requires-python = ">=3.12"
dependencies = [
    "captcha-common",
    "captcha-http",
    "captcha-queue",
    "captcha-db",
    "captcha-observability",
    "captcha-solver-base",
    "captcha-proxy",
    "captcha-fingerprint",
    "captcha-js-runtime",
    "captcha-sensors",
    "captcha-models",
    "captcha-crypto",
    "captcha-solver-pow",
    "captcha-solver-ocr",
    "captcha-solver-audio",
    "captcha-solver-classification",
    "captcha-solver-slider",
    "captcha-solver-rotate",
    "captcha-solver-detection",
    "captcha-solver-score-based",
    "captcha-solver-recaptcha",
    "captcha-solver-funcaptcha",
    "captcha-solver-antibot",
    "captcha-solver-interactive",
    "redis[hiredis]>=5.1",
    "uvloop>=0.21; sys_platform != 'win32'",
    "winloop>=0.1.6; sys_platform == 'win32'",
    "structlog>=24.4.0",
    "msgspec>=0.18.6",
]

[project.scripts]
captcha-worker-http = "captcha_worker_http.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_worker_http"]
