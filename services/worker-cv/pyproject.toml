[project]
name = "captcha-worker-cv"
version = "0.1.0"
description = "CV-lane worker — GPU inference for OCR, audio, classification, detection, slider, rotate."
requires-python = ">=3.12"
dependencies = [
    "captcha-common",
    "captcha-queue",
    "captcha-observability",
    "captcha-solver-base",
    "captcha-models",
    "captcha-solver-ocr",
    "captcha-solver-audio",
    "captcha-solver-classification",
    "captcha-solver-slider",
    "captcha-solver-rotate",
    "captcha-solver-detection",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "redis[hiredis]>=5.1",
    "uvloop>=0.21; sys_platform != 'win32'",
    "winloop>=0.1.6; sys_platform == 'win32'",
    "structlog>=24.4.0",
    "msgspec>=0.18.6",
]

[project.scripts]
captcha-worker-cv = "captcha_worker_cv.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_worker_cv"]
