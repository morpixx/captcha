[project]
name = "captcha-worker-browser"
version = "0.1.0"
description = "Browser-lane worker — playwright/camoufox fallback for URL-mode and antibot chains that insist on a real browser."
requires-python = ">=3.12"
dependencies = [
    "captcha-common",
    "captcha-queue",
    "captcha-observability",
    "captcha-solver-base",
    "captcha-browser",
    "captcha-proxy",
    "captcha-fingerprint",
    "captcha-sensors",
    "captcha-behavior",
    "captcha-solver-antibot",
    "captcha-solver-interactive",
    "captcha-solver-recaptcha",
    "captcha-solver-funcaptcha",
    "captcha-solver-score-based",
    "playwright>=1.47.0",
    "redis[hiredis]>=5.1",
    "uvloop>=0.21; sys_platform != 'win32'",
    "winloop>=0.1.6; sys_platform == 'win32'",
    "structlog>=24.4.0",
    "msgspec>=0.18.6",
]

[project.scripts]
captcha-worker-browser = "captcha_worker_browser.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_worker_browser"]
