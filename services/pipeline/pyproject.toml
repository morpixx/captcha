[project]
name = "captcha-pipeline"
version = "0.1.0"
description = "Dataset collection + drift monitor + retrain trigger for captcha solvers"
requires-python = ">=3.12"
dependencies = [
    "captcha-common",
    "captcha-db",
    "captcha-observability",
    "boto3>=1.35.0",
    "botocore>=1.35.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "apscheduler>=3.10.4",
    "sqlalchemy>=2.0.0",
]

[project.scripts]
captcha-pipeline = "captcha_pipeline.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_pipeline"]
