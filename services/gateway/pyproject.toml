[project]
name = "captcha-gateway"
version = "0.1.0"
description = "FastAPI gateway — 2captcha-compatible public API in front of the solver pool"
requires-python = ">=3.12"
dependencies = [
    "captcha-common",
    "captcha-queue",
    "captcha-db",
    "captcha-observability",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "uvloop>=0.21; sys_platform != 'win32'",
    "orjson>=3.10",
    "redis[hiredis]>=5.1",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.9",
    "structlog>=24.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_gateway"]
