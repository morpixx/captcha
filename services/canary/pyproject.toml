[project]
name = "captcha-canary"
version = "0.1.0"
description = "Fixture-based regression canary — hits the gateway on an interval, alerts on failure"
requires-python = ">=3.12"
dependencies = [
    "captcha-common",
    "captcha-db",
    "captcha-observability",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "apscheduler>=3.10.4",
]

[project.scripts]
captcha-canary = "captcha_canary.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_canary"]
