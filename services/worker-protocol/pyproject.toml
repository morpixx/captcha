[project]
name = "captcha-worker-protocol"
version = "0.1.0"
description = "Protocol-lane worker — PoW, sensor builds, pure-CPU verifier solvers."
requires-python = ">=3.12"
dependencies = [
    "captcha-common",
    "captcha-queue",
    "captcha-observability",
    "captcha-solver-base",
    "captcha-crypto",
    "captcha-sensors",
    "captcha-solver-pow",
    "redis[hiredis]>=5.1",
    "uvloop>=0.21; sys_platform != 'win32'",
    "winloop>=0.1.6; sys_platform == 'win32'",
    "structlog>=24.4.0",
    "msgspec>=0.18.6",
]

[project.scripts]
captcha-worker-protocol = "captcha_worker_protocol.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_worker_protocol"]
