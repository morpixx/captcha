[project]
name = "captcha"
version = "0.1.0"
description = "HTTP-first captcha solver (2captcha/capsolver compatible API)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # api + workers
    "fastapi>=0.115",
    # request.form() in the legacy /in.php endpoint: FastAPI refuses to parse
    # form-encoded bodies without it, and every legacy client sends one.
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32",
    "orjson>=3.10",
    "starlette>=0.41",
    "msgspec>=0.18.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # transport
    "curl_cffi>=0.7",
    "httpx>=0.27",
    "tenacity>=9.0",
    # storage
    "redis[hiredis]>=5.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "boto3>=1.35",
    "botocore>=1.35",
    # js + crypto
    "mini-racer>=0.12",
    "cryptography>=43.0",
    "pycryptodome>=3.21",
    # data / ml primitives
    "numpy>=2.0",
    "pillow>=11",
    "simpleeval>=0.9.13",
    # browser lane: process-tree kill + temporary-profile reaper
    "psutil>=6.0",
    # observability
    "structlog>=24.4",
    "prometheus-client>=0.21",
    # canary daemon (services/canary) schedules runs on an interval
    "apscheduler>=3.10",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "sentry-sdk>=2.17",
]

[project.optional-dependencies]
# heavy, only for the cv lane and browser fallback
cv = ["torch>=2.4", "torchvision>=0.19", "opencv-python-headless>=4.10", "soundfile>=0.12"]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.21",
    "import-linter>=2.1",
    "ipython>=8.28",
]

[project.scripts]
captcha-gateway = "captcha.services.gateway.cli:run"
captcha-worker-http = "captcha.services.worker_http.cli:main"
captcha-worker-cv = "captcha.services.worker_cv.cli:main"
captcha-worker-protocol = "captcha.services.worker_protocol.cli:main"
captcha-cli = "captcha.services.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "B008",    # FastAPI idiom: Depends()/Query() in a default argument is correct there
    "B027",    # Solver.prepare/shutdown are documented no-ops, subclasses may skip them
    "RUF001",  # Cyrillic in strings: error messages and runbook names are ours to pick
    "RUF002",  # same, in docstrings
    "RUF003",  # same, in comments
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
# Needed for pydantic field aliases: without it `error_id=...` on a model whose
# field is aliased to `errorId` looks like a wrong keyword argument.
plugins = ["pydantic.mypy"]

# Optional extras are not installed in the base venv (cv, browser, heavy ML).
# Their absence is a supported state, not a type error.
[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchvision.*",
    "cv2",
    "transformers.*",
    "simpleeval",
    "ultralytics.*",
    "whisper.*",
    "faster_whisper.*",
    "paddleocr.*",
    "mini_racer.*",
    "peft.*",
    "safetensors.*",
    "numpy.*",
]
ignore_missing_imports = true
packages = ["captcha"]
strict = false
warn_unused_ignores = true
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py", "*_test.py"]

# --- architecture contracts -------------------------------------------------
# `make imports` runs these. They are the enforcement of docs/architecture.md:
# if a layer starts importing something it shouldn't, CI goes red.

[tool.importlinter]
root_packages = ["captcha"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain stays pure: no I/O, no upper layers"
type = "forbidden"
source_modules = ["captcha.domain"]
forbidden_modules = [
    "captcha.adapters",
    "captcha.application",
    "captcha.engines",
    "captcha.solvers",
    "captcha.services",
    "captcha.observability",
    "captcha.config",
    "redis",
    "sqlalchemy",
    "fastapi",
    "uvicorn",
    "curl_cffi",
    "boto3",
]

[[tool.importlinter.contracts]]
name = "application depends on domain only"
type = "forbidden"
source_modules = ["captcha.application"]
forbidden_modules = ["captcha.adapters", "captcha.services", "captcha.solvers", "captcha.engines"]

[[tool.importlinter.contracts]]
name = "adapters never reach up"
type = "forbidden"
source_modules = ["captcha.adapters"]
forbidden_modules = ["captcha.application", "captcha.services", "captcha.solvers", "captcha.engines"]

[[tool.importlinter.contracts]]
name = "engines never reach up"
type = "forbidden"
source_modules = ["captcha.engines"]
forbidden_modules = ["captcha.adapters", "captcha.application", "captcha.services", "captcha.solvers"]

[[tool.importlinter.contracts]]
name = "solvers never touch adapters"
type = "forbidden"
source_modules = ["captcha.solvers"]
forbidden_modules = ["captcha.adapters", "captcha.services"]
ignore_imports = [
    # Two text-model solvers read Settings directly as a fallback when the worker
    # hands them a SolverContext without .config. Localised exception, documented
    # in docs/architecture.md — not a pattern to copy.
    "captcha.solvers.audio.audio_captcha -> captcha.config",
    "captcha.solvers.ocr.text_captcha -> captcha.config",
]

[[tool.importlinter.contracts]]
name = "leaf libraries stay leaves"
type = "forbidden"
source_modules = ["captcha.crypto", "captcha.behavior"]
forbidden_modules = [
    "captcha.adapters",
    "captcha.application",
    "captcha.engines",
    "captcha.solvers",
    "captcha.services",
    "captcha.observability",
]