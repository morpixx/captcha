[project]
name = "captcha-solver"
version = "0.1.0"
description = "HTTP-first captcha solver service (2captcha/capsolver compatible)"
requires-python = ">=3.12"
readme = "README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.uv.workspace]
members = [
    "packages/*",
    "solvers/_base",
    "solvers/ocr",
    "solvers/audio",
    "solvers/classification",
    "solvers/slider",
    "solvers/rotate",
    "solvers/detection",
    "solvers/pow",
    "solvers/score_based",
    "solvers/recaptcha",
    "solvers/funcaptcha",
    "solvers/antibot",
    "solvers/interactive",
    "services/gateway",
    "services/worker-http",
    "services/worker-cv",
    "services/worker-protocol",
    "services/worker-browser",
    "services/canary",
    "services/admin",
    "services/pipeline",
]

[tool.uv.sources]
captcha-common = { workspace = true }
captcha-http = { workspace = true }
captcha-queue = { workspace = true }
captcha-db = { workspace = true }
captcha-observability = { workspace = true }
captcha-fingerprint = { workspace = true }
captcha-proxy = { workspace = true }
captcha-behavior = { workspace = true }
captcha-sensors = { workspace = true }
captcha-js-runtime = { workspace = true }
captcha-browser = { workspace = true }
captcha-models = { workspace = true }
captcha-crypto = { workspace = true }
captcha-solver-base = { workspace = true }
captcha-solver-pow = { workspace = true }
captcha-solver-ocr = { workspace = true }
captcha-solver-audio = { workspace = true }
captcha-solver-classification = { workspace = true }
captcha-solver-slider = { workspace = true }
captcha-solver-rotate = { workspace = true }
captcha-solver-detection = { workspace = true }
captcha-solver-score-based = { workspace = true }
captcha-solver-recaptcha = { workspace = true }
captcha-solver-funcaptcha = { workspace = true }
captcha-solver-antibot = { workspace = true }
captcha-solver-interactive = { workspace = true }
captcha-gateway = { workspace = true }
captcha-worker-http = { workspace = true }
captcha-worker-cv = { workspace = true }
captcha-worker-protocol = { workspace = true }
captcha-worker-browser = { workspace = true }
captcha-canary = { workspace = true }
captcha-admin = { workspace = true }
captcha-pipeline = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    "ipython>=8.28.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
disallow_untyped_defs = false
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages", "solvers", "services"]
python_files = ["test_*.py", "*_test.py"]
