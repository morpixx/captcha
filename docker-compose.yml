name: captcha

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    command: redis-server --save 60 1 --loglevel warning
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: captcha
      POSTGRES_PASSWORD: captcha
      POSTGRES_DB: captcha
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U captcha -d captcha"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: infra/docker/gateway.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_URL: postgresql+asyncpg://captcha:captcha@postgres:5432/captcha
      S3_ENDPOINT: http://minio:9000
    ports: ["8080:8080"]
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}

  worker-http:
    build:
      context: .
      dockerfile: infra/docker/worker-http.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_URL: postgresql+asyncpg://captcha:captcha@postgres:5432/captcha
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    deploy:
      replicas: 1

  worker-protocol:
    build:
      context: .
      dockerfile: infra/docker/worker-protocol.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: {condition: service_healthy}

  worker-cv:
    build:
      context: .
      dockerfile: infra/docker/worker-cv.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      WORKER_CV_DEVICE: cpu
    depends_on:
      redis: {condition: service_healthy}

  admin:
    build:
      context: .
      dockerfile: infra/docker/admin.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_URL: postgresql+asyncpg://captcha:captcha@postgres:5432/captcha
    ports: ["8081:8081"]
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}

volumes:
  redis-data:
  postgres-data:
  minio-data:
