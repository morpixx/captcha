# Overlay for the observability stack and the node JS sidecar.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile full up -d
services:
  js-sidecar:
    profiles: ["full"]
    build:
      context: ./src/captcha/adapters/jssandbox/sidecar_node
    restart: unless-stopped
    ports: ["7474:7474"]

  prometheus:
    profiles: ["full"]
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    profiles: ["full"]
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes: [grafana-data:/var/lib/grafana]

volumes:
  grafana-data:
