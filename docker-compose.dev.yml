# Local overlay: host access to the gateway + the observability stack.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile full up -d
#
# Caddy is switched off here: 80/443 belong to whatever else the dev box runs,
# and local traffic goes straight to the loopback port below. Production uses
# docker-compose.yml alone.
services:
  gateway:
    ports: ["127.0.0.1:8080:8080"]

  caddy:
    profiles: ["edge"]

  js-sidecar:
    profiles: ["full"]
    build:
      context: ./src/captcha/adapters/jssandbox/sidecar_node
    restart: unless-stopped
    ports: ["127.0.0.1:7474:7474"]

  prometheus:
    profiles: ["full"]
    image: prom/prometheus:latest
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    profiles: ["full"]
    image: grafana/grafana:latest
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes: [grafana-data:/var/lib/grafana]

volumes:
  grafana-data:
