[project]
name = "captcha-solver-detection"
version = "0.1.0"
description = "Object-detection captcha solvers: click/bbox/draw/drag over YOLOv8"
requires-python = ">=3.12"
dependencies = [
    "captcha-common",
    "captcha-solver-base",
    "captcha-models",
    "Pillow>=10.4",
    "numpy>=2.0",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.3", "opencv-python-headless>=4.10", "torch>=2.3"]

[project.entry-points."captcha.solvers"]
click = "captcha_solver_detection.click:ClickSolver"
coordinates = "captcha_solver_detection.click:ClickSolver"
bounding_box = "captcha_solver_detection.bbox:BBoxSolver"
draw_around = "captcha_solver_detection.draw:DrawAroundSolver"
drag_drop = "captcha_solver_detection.drag:DragDropSolver"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_solver_detection"]
