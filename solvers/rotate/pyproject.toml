[project]
name = "captcha-solver-rotate"
version = "0.1.0"
description = "Rotate captcha solver: classical Hough/PCA, optional ML regressor"
requires-python = ">=3.12"
dependencies = [
    "captcha-common",
    "captcha-solver-base",
    "captcha-models",
    "Pillow>=10.4",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
ml = ["torch>=2.3", "torchvision>=0.18"]

[project.entry-points."captcha.solvers"]
rotate = "captcha_solver_rotate.rotate:RotateSolver"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_solver_rotate"]
