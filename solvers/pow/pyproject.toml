[project]
name = "captcha-solver-pow"
version = "0.1.0"
description = "Proof-of-work captcha solvers: Friendly Captcha + ALTCHA"
requires-python = ">=3.12"
dependencies = [
    "captcha-common",
    "captcha-solver-base",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.entry-points."captcha.solvers"]
friendly = "captcha_solver_pow.friendly:FriendlySolver"
altcha = "captcha_solver_pow.altcha:AltchaSolver"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_solver_pow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
