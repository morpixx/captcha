[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "captcha-solver-ocr"
version = "0.1.0"
description = "OCR-based solvers: image_to_text, math_image, text_captcha (LLM)."
requires-python = ">=3.12"
dependencies = [
    "captcha-common",
    "captcha-solver-base",
    "captcha-http",
    "Pillow>=11",
    "simpleeval>=0.9.13",
    "httpx>=0.27",
]

[project.optional-dependencies]
paddle = [
    "paddlepaddle>=2.6",
    "paddleocr>=2.7",
]
trocr = [
    "transformers>=4.44",
    "torch>=2.3",
]

[project.entry-points."captcha.solvers"]
image_to_text = "captcha_solver_ocr.image_to_text:ImageToTextSolver"
math_image = "captcha_solver_ocr.math_image:MathImageSolver"
text_captcha = "captcha_solver_ocr.text_captcha:TextCaptchaSolver"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_solver_ocr"]
