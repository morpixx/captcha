[project]
name = "captcha-solver-funcaptcha"
version = "0.1.0"
description = "Arkose Labs FunCaptcha solver — rotate/match/image variants + BDA builder"
requires-python = ">=3.12"
dependencies = [
    "captcha-common",
    "captcha-solver-base",
    "captcha-http",
    "captcha-js-runtime",
    "captcha-sensors",
    "captcha-crypto",
    "msgspec>=0.18.6",
    "structlog>=24.1.0",
]

[project.entry-points."captcha.solvers"]
funcaptcha = "captcha_solver_funcaptcha.funcaptcha:FunCaptchaSolver"
funcaptcha_bda = "captcha_solver_funcaptcha.bda:FunCaptchaBDASolver"
funcaptcha_enterprise = "captcha_solver_funcaptcha.funcaptcha:FunCaptchaEnterpriseSolver"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_solver_funcaptcha"]
