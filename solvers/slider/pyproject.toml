[project]
name = "captcha-solver-slider"
version = "0.1.0"
description = "Slider captcha solver: classical edge-diff + template matching, humanized trajectory"
requires-python = ">=3.12"
dependencies = [
    "captcha-common",
    "captcha-solver-base",
    "captcha-behavior",
    "Pillow>=10.4",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
]

[project.entry-points."captcha.solvers"]
slider = "captcha_solver_slider.slider:SliderSolver"
capy = "captcha_solver_slider.slider:SliderSolver"
keycaptcha = "captcha_solver_slider.slider:SliderSolver"
lemin = "captcha_solver_slider.slider:SliderSolver"
cutcaptcha_slider = "captcha_solver_slider.slider:SliderSolver"
datadome_slider = "captcha_solver_slider.slider:SliderSolver"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_solver_slider"]
