[project]
name = "captcha-solver-recaptcha"
version = "0.1.0"
description = "reCAPTCHA v2 solver (audio-bypass path) + v2 Enterprise variant"
requires-python = ">=3.12"
dependencies = [
    "captcha-common",
    "captcha-solver-base",
    "captcha-http",
    "captcha-sensors",
    "msgspec>=0.18.6",
    "structlog>=24.1.0",
]

[project.entry-points."captcha.solvers"]
recaptcha_v2 = "captcha_solver_recaptcha.v2_audio:RecaptchaV2AudioSolver"
recaptcha_v2_invisible = "captcha_solver_recaptcha.v2_audio:RecaptchaV2AudioSolver"
recaptcha_v2_callback = "captcha_solver_recaptcha.v2_audio:RecaptchaV2AudioSolver"
recaptcha_v2_enterprise = "captcha_solver_recaptcha.v2_audio:RecaptchaV2EnterpriseSolver"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_solver_recaptcha"]
