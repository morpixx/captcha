[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "captcha-solver-antibot"
version = "0.1.0"
description = "Antibot-engine solvers (CF, Akamai, DataDome, Kasada, PerimeterX, Imperva, Castle, TSPD, CyberSiARA, Twitch, BotGuard, BotDeflector)."
requires-python = ">=3.12"
dependencies = [
    "captcha-common",
    "captcha-solver-base",
    "captcha-http",
    "captcha-sensors",
    "captcha-fingerprint",
    "captcha-js-runtime",
    "msgspec>=0.18.6",
    "structlog>=24.1",
]

[project.entry-points."captcha.solvers"]
cloudflare_challenge = "captcha_solver_antibot.cloudflare.solver:CloudflareChallengeSolver"
turnstile = "captcha_solver_antibot.cloudflare.turnstile:TurnstileSolver"
akamai_sensor = "captcha_solver_antibot.akamai.solver:AkamaiSensorSolver"
akamai_sbsd = "captcha_solver_antibot.akamai.sbsd:AkamaiSBSDSolver"
datadome = "captcha_solver_antibot.datadome.solver:DataDomeSolver"
kasada = "captcha_solver_antibot.kasada.solver:KasadaSolver"
perimeterx = "captcha_solver_antibot.perimeterx.solver:PerimeterXSolver"
imperva = "captcha_solver_antibot.imperva.solver:ImpervaSolver"
castle = "captcha_solver_antibot.castle.solver:CastleSolver"
tspd = "captcha_solver_antibot.tspd.solver:TSPDSolver"
cybersiara = "captcha_solver_antibot.cybersiara.solver:CyberSiARASolver"
twitch_integrity = "captcha_solver_antibot.twitch_integrity.solver:TwitchIntegritySolver"
botguard = "captcha_solver_antibot.botguard.solver:BotGuardSolver"
botdeflector = "captcha_solver_antibot.botdeflector.solver:BotDeflectorSolver"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_solver_antibot"]
