[project]
name = "captcha-solver-score-based"
version = "0.1.0"
description = "Score-based token solvers: Turnstile invisible, reCAPTCHA v3 / v3 Enterprise"
requires-python = ">=3.12"
dependencies = [
    "captcha-common",
    "captcha-solver-base",
    "captcha-http",
    "captcha-sensors",
    "captcha-fingerprint",
    "msgspec>=0.18.6",
    "structlog>=24.1.0",
]

[project.entry-points."captcha.solvers"]
turnstile_invisible = "captcha_solver_score_based.turnstile:TurnstileInvisibleSolver"
recaptcha_v3 = "captcha_solver_score_based.recaptcha_v3:RecaptchaV3Solver"
recaptcha_v3_enterprise = "captcha_solver_score_based.recaptcha_v3:RecaptchaV3EnterpriseSolver"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_solver_score_based"]
