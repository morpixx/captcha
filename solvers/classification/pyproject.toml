[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "captcha-solver-classification"
version = "0.1.0"
description = "ViT-backbone + LoRA-head classification for grid captchas (hcaptcha, recaptcha grid, funcaptcha grid, awswaf, shein)."
requires-python = ">=3.12"
dependencies = [
    "captcha-common",
    "captcha-solver-base",
    "captcha-models",
    "Pillow>=11",
    "numpy>=2.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.4",
    "torchvision>=0.19",
]
hf = [
    "transformers>=4.44",
]
peft = [
    "peft>=0.12",
    "safetensors>=0.4",
]

[project.entry-points."captcha.solvers"]
hcaptcha = "captcha_solver_classification.hcaptcha:HCaptchaSolver"
recaptcha_grid = "captcha_solver_classification.recaptcha_grid:RecaptchaGridSolver"
funcaptcha_grid = "captcha_solver_classification.funcaptcha_grid:FunCaptchaGridSolver"
awswaf = "captcha_solver_classification.awswaf:AWSWAFSolver"
shein = "captcha_solver_classification.shein:SheinSolver"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_solver_classification"]
