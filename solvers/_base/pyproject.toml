[project]
name = "captcha-solver-base"
version = "0.1.0"
description = "Solver ABC, plugin registry, test harness"
requires-python = ">=3.12"
dependencies = [
    "captcha-common",
    "msgspec>=0.18.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_solver_base"]
