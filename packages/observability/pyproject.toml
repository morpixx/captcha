[project]
name = "captcha-observability"
version = "0.1.0"
description = "Structured logging, Prometheus metrics, OTel tracing, Sentry — one place."
requires-python = ">=3.12"
dependencies = [
    "captcha-common",
    "structlog>=24.0",
    "prometheus-client>=0.21",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-api>=1.27",
    "sentry-sdk>=2.17",
    "starlette>=0.41",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_observability"]
