[project]
name = "captcha-fingerprint"
version = "0.1.0"
description = "TLS (JA3/JA4) + browser fingerprint profiles & bundles for captcha-solver"
requires-python = ">=3.12"
dependencies = [
    "captcha-common",
    "msgspec>=0.18.6",
    "orjson>=3.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_fingerprint"]
