[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "captcha-db"
version = "0.1.0"
description = "Postgres layer for the captcha-solver service — SQLAlchemy 2 async models, repositories, Alembic migrations."
requires-python = ">=3.12"
dependencies = [
    "captcha-common",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "msgspec>=0.18",
]

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_db"]

[tool.hatch.build.targets.wheel.force-include]
"src/captcha_db/migrations" = "captcha_db/migrations"
