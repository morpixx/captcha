[project]
name = "captcha-crypto"
version = "0.1.0"
description = "Crypto helpers for captcha/antibot payloads: AES-CBC/GCM, RSA-OAEP/PKCS1v15, rotating XOR, HMAC, raw deflate."
requires-python = ">=3.12"
dependencies = [
    "captcha-common",
    "cryptography>=43.0",
    "pycryptodome>=3.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_crypto"]
