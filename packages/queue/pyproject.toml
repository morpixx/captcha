[project]
name = "captcha-queue"
version = "0.1.0"
description = "Redis Streams queue + task state store for the captcha-solver service"
requires-python = ">=3.12"
dependencies = [
    "captcha-common",
    "redis[hiredis]>=5.1",
    "msgspec>=0.18.6",
    "structlog>=24.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_queue"]
