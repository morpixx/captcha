[project]
name = "captcha-sensors"
version = "0.1.0"
description = "Per-antibot-engine sensor payload builders (Akamai, DataDome, Kasada, PerimeterX, Imperva, Cloudflare, ...)"
requires-python = ">=3.12"
dependencies = [
    "captcha-common",
    "captcha-behavior",
    "captcha-fingerprint",
    "captcha-crypto",
    "captcha-js-runtime",
    "msgspec>=0.18.6",
    "structlog>=24.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_sensors"]
