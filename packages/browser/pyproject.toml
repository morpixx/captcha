[project]
name = "captcha-browser"
version = "0.1.0"
description = "Browser pool (playwright with patchright / camoufox fallbacks) for URL-mode and HTTP-fallback solves"
requires-python = ">=3.12"
dependencies = [
    "captcha-common",
    "captcha-fingerprint",
    "captcha-behavior",
    "playwright>=1.48",
    "structlog>=24.1",
]

[project.optional-dependencies]
patchright = ["patchright>=1.48"]
camoufox = ["camoufox>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_browser"]
