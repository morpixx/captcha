[project]
name = "captcha-behavior"
version = "0.1.0"
description = "Humanized mouse paths + timing for browser fallback & sensor payload emulation"
requires-python = ">=3.12"
dependencies = [
    "captcha-common",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_behavior"]
