[project]
name = "captcha-proxy"
version = "0.1.0"
description = "Residential proxy pool manager (sticky sessions, rotation, ban-detection)"
requires-python = ">=3.12"
dependencies = [
    "captcha-common",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "msgspec>=0.18.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_proxy"]
