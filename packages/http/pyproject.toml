[project]
name = "captcha-http"
version = "0.1.0"
description = "HTTP stealth core — curl_cffi wrapper, JA3/JA4 profile picker, retry, proxy binding"
requires-python = ">=3.12"
dependencies = [
    "captcha-common",
    "curl_cffi>=0.7.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.0",
    "msgspec>=0.18.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_http"]
