[project]
name = "captcha-common"
version = "0.1.0"
description = "Shared types, schemas, enums, config for captcha-solver"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "msgspec>=0.18.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_common"]
