[project]
name = "captcha-models"
version = "0.1.0"
description = "ML model registry + loader for captcha solvers. Pulls weights from S3/MinIO, caches on disk, hot-reloads."
requires-python = ">=3.12"
dependencies = [
    "captcha-common",
    "boto3>=1.35",
    "botocore>=1.35",
    "msgspec>=0.18.6",
    "structlog>=24.4",
]

[project.optional-dependencies]
torch = ["torch>=2.4"]
onnx = ["onnxruntime>=1.19"]
hf = ["transformers>=4.44", "safetensors>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_models"]
