<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}captcha-admin{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
<script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.3/htmx.min.js"
        integrity="sha512-rB7HdRhTmT4cBk9WakqrgHzqJ/UrE2o+bA5lkYjQiKfwIkJm2PMw8yYyFjNhxU2U3eIIBxP0Yi/1B0W0kLTg0A=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
<header class="bar">
  <strong>captcha-admin</strong>
  <nav>
    <a href="/">overview</a>
    <a href="/solvers">solvers</a>
    <a href="/tasks">tasks</a>
    <a href="/proxies">proxies</a>
  </nav>
  <span class="spacer"></span>
  {% block window_switch %}
  <form method="get" class="windowbar">
    <label>window
      <select name="window" onchange="this.form.submit()">
        {% for w in ['1h','24h','7d','30d'] %}
          <option value="{{ w }}" {% if window==w %}selected{% endif %}>{{ w }}</option>
        {% endfor %}
      </select>
    </label>
  </form>
  {% endblock %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
